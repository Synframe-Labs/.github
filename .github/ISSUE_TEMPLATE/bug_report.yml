name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, or confidential client information. Report security vulnerabilities using the security policy.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the steps and any relevant, sanitized examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant errors or screenshots with sensitive information removed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Include the affected version or commit and relevant environment details.
    validations:
      required: true
